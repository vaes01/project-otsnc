<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Onde Tem Show na Cena?</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="header">

  <div class="container">

    <h1>🎸 Onde Tem Show Na Cena?</h1>

    <p>
      Bora dar um rolê? Aqui tem show até na faixa!
    </p>

     <!-- <p>
      Ah, e só aparece casa de show que tem evento nos próximos dias, blz?
    </p> -->


    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSfeK1O28GrkpoVfq58d0j5ANjsH3_-KCjVg7k4seafLToSncA/viewform"
      target="_blank"
      rel="noopener noreferrer"
      class="venue-registration"
    >
      🎤 Quer divulgar seu show? Clica aqui pra cadastrar.
    </a>



  </div>

</header>



<main class="container">


  <!-- FILTERS -->

  <section class="filters">


    <!-- CASA -->

    <div class="filter">

      <label for="casaSelect">
        Casa de Show
      </label>

      <select id="casaSelect">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- CIDADE -->

    <div class="filter">

      <label for="cidade">
        Cidade
      </label>

      <select id="cidade">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- REGIAO -->

    <div class="filter">

      <label for="regiao">
        Região
      </label>

      <select id="regiao">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- BAIRRO -->

    <div class="filter">

      <label for="bairro">
        Bairro
      </label>

      <select id="bairro">

        <option value="">
          Todos
        </option>

      </select>

    </div>


    <!-- ENDERECO -->

    <div class="filter">

      <label for="endereco">
        Endereço
      </label>

      <input
        id="endereco"
        type="text"
        placeholder="Digite o endereço..."
        autocomplete="off"
      >

      <div
        id="enderecoSuggestions"
        class="suggestions"
      ></div>

    </div>

    <!-- DATA INICIAL E FINAL -->

    <div class="filter date-filter">

  <label>
    Período
  </label>

  <button
    type="button"
    id="dateRangeButton"
    class="date-range-button"
  >
    📅 <span id="dateRangeText">Selecionar período</span>
  </button>


  <div
    id="datePicker"
    class="date-picker hidden"
  >

    <div class="calendar-header">

      <button
        type="button"
        id="previousMonth"
        class="calendar-nav"
      >
        ‹
      </button>

      <strong id="calendarMonth">
        Agosto 2026
      </strong>

      <button
        type="button"
        id="nextMonth"
        class="calendar-nav"
      >
        ›
      </button>

    </div>


    <div
      id="calendar"
      class="calendar"
    ></div>


    <div class="calendar-footer">

      <div id="dateSelectionStatus">
        Selecione a data inicial
      </div>

      <button
        type="button"
        id="clearDateRange"
      >
        Limpar
      </button>

    </div>

  </div>

</div>



    <!-- HORARIO -->

    <div class="filter">

      <label for="horario">
        Horário
      </label>

      <input
        id="horario"
        type="text"
        placeholder="Ex: 19:00"
        autocomplete="off"
      >

      <div
        id="horarioSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- BANDAS -->

    <div class="filter">

      <label for="bandas">
        Bandas / Estilos
      </label>

      <input
        id="bandas"
        type="text"
        placeholder="Nome da banda ou estilo..."
        autocomplete="off"
      >

      <div
        id="bandasSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- PRECO DO INGRESSO -->

    <div class="filter price-filter">

  <label>
    Preço inicial do ingresso
  </label>


  <div class="price-inputs">

    <div>

      <span>R$ mínimo</span>

      <input
        id="priceMinInput"
        type="number"
        min="0"
        step="1"
        placeholder="0"
      >

    </div>


    <div>

      <span>R$ máximo</span>

      <input
        id="priceMaxInput"
        type="number"
        min="0"
        step="1"
        placeholder="Máx."
      >

    </div>

  </div>


  <div class="price-slider">

    <div
      class="slider-track"
      id="sliderTrack"
    ></div>


    <input
      id="priceMinRange"
      type="range"
      min="0"
      max="500"
      value="0"
      step="1"
    >


    <input
      id="priceMaxRange"
      type="range"
      min="0"
      max="500"
      value="500"
      step="1"
    >

  </div>


  <div class="price-labels">

    <span id="priceMinLabel">
      R$ 0
    </span>

    <span id="priceMaxLabel">
      R$ 500+
    </span>

  </div>

</div>



  </section>



  <div class="filter-actions">

    <button id="clearFilters">
      Limpar filtros
    </button>

    <span id="resultCount"></span>

  </div>



  <div id="loading">
    Carregando shows...
  </div>



  <section
    id="shows"
    class="shows"
  ></section>



  <div
    id="noResults"
    class="no-results hidden"
  >
    Nenhum show encontrado.
  </div>


  


</main>



<script src="script.js"></script>

</body>

</html>
