<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rock Shows</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="header">

  <div class="container">

    <h1>🎸 Rock Shows</h1>

    <p>
      Encontre os próximos shows
    </p>

  </div>

</header>



<main class="container">


  <!-- FILTERS -->

  <section class="filters">


    <!-- CASA -->

    <div class="filter">

      <label for="casaSelect">
        Casa de Show
      </label>

      <select id="casaSelect">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <div class="filter">

      <label for="casaSearch">
        Buscar Casa de Show
      </label>

      <input
        id="casaSearch"
        type="text"
        placeholder="Digite o nome..."
        autocomplete="off"
      >

      <div
        id="casaSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- CIDADE -->

    <div class="filter">

      <label for="cidade">
        Cidade
      </label>

      <select id="cidade">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- REGIAO -->

    <div class="filter">

      <label for="regiao">
        Região
      </label>

      <select id="regiao">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- BAIRRO -->

    <div class="filter">

      <label for="bairro">
        Bairro
      </label>

      <select id="bairro">

        <option value="">
          Todos
        </option>

      </select>

    </div>


    <!-- ENDERECO -->

    <div class="filter">

      <label for="endereco">
        Endereço
      </label>

      <input
        id="endereco"
        type="text"
        placeholder="Digite o endereço..."
        autocomplete="off"
      >

      <div
        id="enderecoSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- INSTAGRAM -->

    <div class="filter">

      <label for="instagram">
        Instagram
      </label>

      <input
        id="instagram"
        type="text"
        placeholder="@..."
        autocomplete="off"
      >

      <div
        id="instagramSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- DATA INICIAL -->

    <div class="filter">

      <label for="dataInicio">
        Data inicial
      </label>

      <input
        id="dataInicio"
        type="date"
      >

    </div>


    <!-- DATA FINAL -->

    <div class="filter">

      <label for="dataFim">
        Data final
      </label>

      <input
        id="dataFim"
        type="date"
      >

    </div>


    <!-- HORARIO -->

    <div class="filter">

      <label for="horario">
        Horário
      </label>

      <input
        id="horario"
        type="text"
        placeholder="Ex: 19:00"
        autocomplete="off"
      >

      <div
        id="horarioSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- BANDAS -->

    <div class="filter">

      <label for="bandas">
        Bandas
      </label>

      <input
        id="bandas"
        type="text"
        placeholder="Nome da banda..."
        autocomplete="off"
      >

      <div
        id="bandasSuggestions"
        class="suggestions"
      ></div>

    </div>


  </section>



  <div class="filter-actions">

    <button id="clearFilters">
      Limpar filtros
    </button>

    <span id="resultCount"></span>

  </div>



  <div id="loading">
    Carregando shows...
  </div>



  <section
    id="shows"
    class="shows"
  ></section>



  <div
    id="noResults"
    class="no-results hidden"
  >
    Nenhum show encontrado.
  </div>


</main>



<script src="script.js"></script>

</body>

</html>
