<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rock Shows</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="header">

  <div class="container">

    <h1>🎸 Rock Shows</h1>

    <p>
      Encontre os próximos shows
    </p>

  </div>

</header>



<main class="container">


  <!-- FILTERS -->

  <section class="filters">


    <!-- CASA -->

    <div class="filter">

      <label for="casaSelect">
        Casa de Show
      </label>

      <select id="casaSelect">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <div class="filter">

      <label for="casaSearch">
        Buscar Casa de Show
      </label>

      <input
        id="casaSearch"
        type="text"
        placeholder="Digite o nome..."
        autocomplete="off"
      >

      <div
        id="casaSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- CIDADE -->

    <div class="filter">

      <label for="cidade">
        Cidade
      </label>

      <select id="cidade">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- REGIAO -->

    <div class="filter">

      <label for="regiao">
        Região
      </label>

      <select id="regiao">

        <option value="">
          Todas
        </option>

      </select>

    </div>


    <!-- BAIRRO -->

    <div class="filter">

      <label for="bairro">
        Bairro
      </label>

      <select id="bairro">

        <option value="">
          Todos
        </option>

      </select>

    </div>


    <!-- ENDERECO -->

    <div class="filter">

      <label for="endereco">
        Endereço
      </label>

      <input
        id="endereco"
        type="text"
        placeholder="Digite o endereço..."
        autocomplete="off"
      >

      <div
        id="enderecoSuggestions"
        class="suggestions"
      ></div>

    </div>

    <!-- DATA INICIAL E FINAL -->

    <div class="filter date-filter">

  <label>
    Período
  </label>

  <button
    type="button"
    id="dateRangeButton"
    class="date-range-button"
  >
    📅 <span id="dateRangeText">Selecionar período</span>
  </button>


  <div
    id="datePicker"
    class="date-picker hidden"
  >

    <div class="calendar-header">

      <button
        type="button"
        id="previousMonth"
        class="calendar-nav"
      >
        ‹
      </button>

      <strong id="calendarMonth">
        Agosto 2026
      </strong>

      <button
        type="button"
        id="nextMonth"
        class="calendar-nav"
      >
        ›
      </button>

    </div>


    <div
      id="calendar"
      class="calendar"
    ></div>


    <div class="calendar-footer">

      <div id="dateSelectionStatus">
        Selecione a data inicial
      </div>

      <button
        type="button"
        id="clearDateRange"
      >
        Limpar
      </button>

    </div>

  </div>

</div>



    <!-- HORARIO -->

    <div class="filter">

      <label for="horario">
        Horário
      </label>

      <input
        id="horario"
        type="text"
        placeholder="Ex: 19:00"
        autocomplete="off"
      >

      <div
        id="horarioSuggestions"
        class="suggestions"
      ></div>

    </div>


    <!-- BANDAS -->

    <div class="filter">

      <label for="bandas">
        Bandas
      </label>

      <input
        id="bandas"
        type="text"
        placeholder="Nome da banda..."
        autocomplete="off"
      >

      <div
        id="bandasSuggestions"
        class="suggestions"
      ></div>

    </div>


  </section>



  <div class="filter-actions">

    <button id="clearFilters">
      Limpar filtros
    </button>

    <span id="resultCount"></span>

  </div>



  <div id="loading">
    Carregando shows...
  </div>



  <section
    id="shows"
    class="shows"
  ></section>



  <div
    id="noResults"
    class="no-results hidden"
  >
    Nenhum show encontrado.
  </div>


</main>



<script src="script.js"></script>

</body>

</html>
